name: Build Installers V2

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - main
      - audit-safe-fixes
    tags:
      - 'v*'
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: write

jobs:
  debian:
    name: Debian Package
    runs-on: ubuntu-24.04
    container:
      image: debian:13

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build dependencies
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            cmake ninja-build build-essential pkg-config dpkg-dev \
            qt6-base-dev qt6-base-dev-tools qt6-tools-dev qt6-tools-dev-tools linguist-qt6 \
            libqt6sql6-sqlite libqt6sql6-mysql libmariadb-dev-compat \
            libsecret-1-dev

      - name: Configure and build
        shell: bash
        run: |
          cmake -S . -B build-debian -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-debian -j 4

      - name: Package deb
        shell: bash
        run: bash ci/package-debian.sh build-debian dist/debian

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Inwentaryzacja-debian-package
          path: dist/debian/*.deb

  windows:
    name: Windows Installer
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Qt with aqtinstall
        shell: pwsh
        run: |
          python -m pip install --upgrade pip aqtinstall
          python -m aqt install-qt windows desktop 6.8.2 win64_msvc2022_64 --outputdir "$env:RUNNER_TEMP\Qt"
          "QT_ROOT=$env:RUNNER_TEMP\Qt\6.8.2\msvc2022_64" >> $env:GITHUB_ENV
          "$env:RUNNER_TEMP\Qt\6.8.2\msvc2022_64\bin" >> $env:GITHUB_PATH

      - name: Install zlib and MariaDB Connector/C with vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if ([string]::IsNullOrWhiteSpace($vcpkgRoot)) {
            $vcpkgRoot = 'C:\vcpkg'
          }
          if (-not (Test-Path (Join-Path $vcpkgRoot 'vcpkg.exe'))) {
            throw "Nie znaleziono vcpkg.exe w: $vcpkgRoot"
          }
          & (Join-Path $vcpkgRoot 'vcpkg.exe') install zlib:x64-windows libmariadb:x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install: kod $LASTEXITCODE" }
          "APP_VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
          "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV

      - name: Install Qt sources (qtbase)
        shell: pwsh
        run: python -m aqt install-src windows 6.8.2 --archives qtbase --outputdir "$env:RUNNER_TEMP\QtSrc"

      # Binarki Qt nie mają pluginu QMYSQL (dokumentacja Qt „SQL Database Drivers”: z binarkami idzie
      # SQLite, na Windows także ODBC i PostgreSQL). Budowa wg „How to Build the QMYSQL Plugin on Windows”.
      - name: Build QMYSQL Qt plugin
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSINSTALL=%%i
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          for /f "usebackq delims=" %%i in (`qmake -query QT_INSTALL_PREFIX`) do set QT_PATH=%%i
          set MARIADB=%APP_VCPKG_ROOT%\installed\x64-windows
          mkdir "%RUNNER_TEMP%\build_qmysql"
          cd /d "%RUNNER_TEMP%\build_qmysql"
          call "%QT_PATH%\bin\qt-cmake.bat" -G Ninja "%RUNNER_TEMP%\QtSrc\6.8.2\Src\qtbase\src\plugins\sqldrivers" -DCMAKE_BUILD_TYPE=Release -DMySQL_INCLUDE_DIR="%MARIADB%\include\mysql" -DMySQL_LIBRARY="%MARIADB%\lib\libmariadb.lib" || exit /b 1
          cmake --build . --target QMYSQLDriverPlugin || exit /b 1
          for /r %%f in (qsqlmysql.dll) do if exist "%%f" copy /y "%%f" "%QT_PATH%\plugins\sqldrivers\" || exit /b 1
          if not exist "%QT_PATH%\plugins\sqldrivers\qsqlmysql.dll" (echo Brak qsqlmysql.dll po budowie & exit /b 1)
          dumpbin /dependents "%QT_PATH%\plugins\sqldrivers\qsqlmysql.dll"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Configure and build
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSINSTALL=%%i
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          set VCPKG_ROOT=%APP_VCPKG_ROOT%
          for /f "usebackq delims=" %%i in (`qmake -query QT_INSTALL_PREFIX`) do set QT_PATH=%%i
          cmake -S . -B build-windows -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="%QT_PATH%" -DCMAKE_TOOLCHAIN_FILE="%VCPKG_ROOT%\scripts\buildsystems\vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows
          cmake --build build-windows --config Release -j 4

      - name: Package installer
        shell: pwsh
        run: .\ci\package-windows.ps1 -BuildDir build-windows -OutputDir dist\windows

      # Test uruchomiony z KOPII katalogu paczki, z PATH bez Qt i vcpkg — jak u usera. Brak pluginu
      # QMYSQL albo libmariadb.dll obok exe = czerwony (paczki do 1.6.1 tego nie miały).
      - name: Check QMYSQL driver in package
        shell: pwsh
        run: |
          $probe = Join-Path $env:RUNNER_TEMP 'sonda-paczki'
          Copy-Item 'dist\windows\stage\Inwentaryzacja' $probe -Recurse
          Copy-Item 'build-windows\InwentaryzacjaTests.exe' $probe
          Copy-Item (Join-Path $env:QT_ROOT 'bin\Qt6Test.dll') $probe
          $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot"
          $env:INW_WYMAGAJ_QMYSQL = '1'
          & (Join-Path $probe 'InwentaryzacjaTests.exe') sqlDriver_mysqlPluginLoads
          if ($LASTEXITCODE -ne 0) { throw "Paczka bez działającego sterownika QMYSQL (kod $LASTEXITCODE)" }

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Inwentaryzacja-windows-installer
          path: |
            dist/windows/*.exe
            dist/windows/*.zip

  macos-intel:
    name: macOS Intel Installer
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Qt with aqtinstall
        shell: bash
        run: |
          python -m pip install --upgrade pip aqtinstall
          python -m aqt install-qt mac desktop 6.8.2 clang_64 --outputdir "$RUNNER_TEMP/Qt"
          echo "$RUNNER_TEMP/Qt/6.8.2/macos/bin" >> "$GITHUB_PATH"

      - name: Build QMYSQL Qt plugin
        shell: bash
        run: bash ci/build-qt-mysql-plugin-macos.sh

      - name: Configure and build
        shell: bash
        run: |
          QT_PATH="$(qmake -query QT_INSTALL_PREFIX)"
          cmake -S . -B build-macos-intel -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_PATH"
          cmake --build build-macos-intel -j 4

      - name: Check QMYSQL plugin in Qt install
        shell: bash
        run: INW_WYMAGAJ_QMYSQL=1 QT_QPA_PLATFORM=offscreen ./build-macos-intel/InwentaryzacjaTests sqlDriver_mysqlPluginLoads

      # Stała tożsamość podpisu (sekrety repo) — Pęk kluczy nie pyta po każdej aktualizacji.
      - name: Import code signing identity
        shell: bash
        env:
          MACOS_CODESIGN_P12_BASE64: ${{ secrets.MACOS_CODESIGN_P12_BASE64 }}
          MACOS_CODESIGN_P12_PASSWORD: ${{ secrets.MACOS_CODESIGN_P12_PASSWORD }}
          REQUIRE_CODESIGN: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
        run: bash ci/import-macos-codesign.sh

      - name: Package installer
        shell: bash
        env:
          REQUIRE_CODESIGN: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
        run: bash ci/package-macos.sh build-macos-intel dist/macos-intel intel

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Inwentaryzacja-macos-intel-installer
          path: |
            dist/macos-intel/*.dmg
            dist/macos-intel/*.zip

  macos-arm:
    name: macOS ARM Installer
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Qt with aqtinstall
        shell: bash
        run: |
          python -m pip install --upgrade pip aqtinstall
          python -m aqt install-qt mac desktop 6.8.2 clang_64 --outputdir "$RUNNER_TEMP/Qt"
          echo "$RUNNER_TEMP/Qt/6.8.2/macos/bin" >> "$GITHUB_PATH"

      - name: Build QMYSQL Qt plugin
        shell: bash
        run: bash ci/build-qt-mysql-plugin-macos.sh

      - name: Configure and build
        shell: bash
        run: |
          QT_PATH="$(qmake -query QT_INSTALL_PREFIX)"
          cmake -S . -B build-macos-arm -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_PATH"
          cmake --build build-macos-arm -j 4

      - name: Check QMYSQL plugin in Qt install
        shell: bash
        run: INW_WYMAGAJ_QMYSQL=1 QT_QPA_PLATFORM=offscreen ./build-macos-arm/InwentaryzacjaTests sqlDriver_mysqlPluginLoads

      # Stała tożsamość podpisu (sekrety repo) — Pęk kluczy nie pyta po każdej aktualizacji.
      - name: Import code signing identity
        shell: bash
        env:
          MACOS_CODESIGN_P12_BASE64: ${{ secrets.MACOS_CODESIGN_P12_BASE64 }}
          MACOS_CODESIGN_P12_PASSWORD: ${{ secrets.MACOS_CODESIGN_P12_PASSWORD }}
          REQUIRE_CODESIGN: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
        run: bash ci/import-macos-codesign.sh

      - name: Package installer
        shell: bash
        env:
          REQUIRE_CODESIGN: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
        run: bash ci/package-macos.sh build-macos-arm dist/macos-arm arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Inwentaryzacja-macos-arm-installer
          path: |
            dist/macos-arm/*.dmg
            dist/macos-arm/*.zip

  release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - debian
      - windows
      - macos-intel
      - macos-arm
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: Inwentaryzacja-windows-installer
          path: release-assets/windows

      - name: Download Debian artifact
        uses: actions/download-artifact@v8
        with:
          name: Inwentaryzacja-debian-package
          path: release-assets/debian

      - name: Download macOS Intel artifact
        uses: actions/download-artifact@v8
        with:
          name: Inwentaryzacja-macos-intel-installer
          path: release-assets/macos-intel

      - name: Download macOS ARM artifact
        uses: actions/download-artifact@v8
        with:
          name: Inwentaryzacja-macos-arm-installer
          path: release-assets/macos-arm

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Inwentaryzacja ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/debian/*
            release-assets/windows/*
            release-assets/macos-intel/*
            release-assets/macos-arm/*
